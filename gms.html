<html lang="en">
<head>
<meta charset="UTF-8">
<title>gs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --void:#030b07;
  --glass:rgba(7,32,20,.5);
  --line:rgba(64,214,140,.22);
  --line-strong:rgba(64,214,140,.55);
  --accent:#28d17c;
  --accent-bright:#7cf7b4;
  --accent-deep:#0a8f4a;
  --text:#d8fbe9;
  --text-dim:#6f9c86;
  --star:#f6cf4b;
  --radius:18px;
  --font-display:"Press Start 2P", monospace;
  --font-body:"Space Grotesk", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-body);}
::selection{background:var(--accent-deep);color:#04140b;}
body{
  min-height:100vh;
  color:var(--text);
  background-image:
    linear-gradient(rgba(0,0,0,.4), rgba(0,0,0,.4)),
    url("https://i.postimg.cc/wMC4mCq6/WP.gif");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;
  padding-bottom:60px;
  position:relative;
  overflow-x:hidden;
}
a{color:inherit;}

.wrap{max-width:1240px;margin:0 auto;padding:0 18px;position:relative;z-index:3;}

header.top{padding-top:22px;}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px;}
.brand{
  display:flex;align-items:center;gap:12px;
  font-family:var(--font-display);
  font-size:15px;
  letter-spacing:1px;
  color:var(--accent-bright);
  text-shadow:0 0 18px rgba(124,247,180,.45);
}
.brand .dot{
  width:10px;height:10px;border-radius:2px;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent), 0 0 22px var(--accent-deep);
  animation:blink 1.4s steps(2) infinite;
}
@keyframes blink{50%{opacity:.15;}}
.terminal{
  font-family:"Space Grotesk", monospace;
  font-size:12.5px;
  color:var(--text-dim);
  display:flex;
  align-items:center;
  gap:6px;
}
.terminal .cursor{
  width:7px;height:14px;background:var(--accent);
  animation:blink 1s steps(2) infinite;
}

.toolbar{
  display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:14px;
  background:var(--glass);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 10px 34px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.03);
}
.searchbox{
  flex:1 1 220px;
  position:relative;
  min-width:180px;
}
.searchbox svg{
  position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;stroke:var(--text-dim);
  pointer-events:none;
}
#search{
  width:100%;
  padding:11px 12px 11px 36px;
  border-radius:11px;
  border:1px solid var(--line);
  background:rgba(3,16,10,.65);
  color:var(--text);
  outline:none;
  font-size:14px;
  transition:border-color .15s, box-shadow .15s;
}
#search::placeholder{color:var(--text-dim);}
#search:focus{border-color:var(--line-strong);box-shadow:0 0 0 3px rgba(40,209,124,.15);}

.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{
  padding:9px 14px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(3,16,10,.5);
  color:var(--text-dim);
  font-size:12.5px;
  font-weight:600;
  cursor:pointer;
  white-space:nowrap;
  transition:all .15s;
}
.chip:hover{border-color:var(--line-strong);color:var(--text);}
.chip.active{
  background:var(--accent-deep);
  color:#04140b;
  border-color:var(--accent);
  box-shadow:0 0 14px rgba(40,209,124,.4);
}

#counterBox{
  padding:11px 16px;
  border-radius:11px;
  border:1px solid var(--line);
  background:rgba(3,16,10,.65);
  font-size:12.5px;
  font-weight:600;
  color:var(--accent-bright);
  min-width:96px;
  text-align:center;
  white-space:nowrap;
}


.recent{margin-top:18px;}
.recent h2{
  font-size:11.5px;
  color:var(--text-dim);
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-bottom:10px;
  font-weight:600;
}
.recent-row{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;}
.recent-row::-webkit-scrollbar{height:6px;}
.recent-row::-webkit-scrollbar-thumb{background:var(--accent-deep);border-radius:6px;}
.rchip{
  flex:0 0 auto;
  display:flex;align-items:center;gap:8px;
  padding:7px 12px 7px 7px;
  border-radius:999px;
  background:var(--glass);
  border:1px solid var(--line);
  cursor:pointer;
  font-size:12.5px;
  transition:border-color .15s, transform .15s;
}
.rchip:hover{border-color:var(--line-strong);transform:translateY(-2px);}
.rchip img{width:24px;height:24px;border-radius:6px;object-fit:cover;}


.grid{
  margin-top:22px;
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(158px, 1fr));
  gap:16px;
}
.card{
  position:relative;
  cursor:pointer;
  border-radius:16px;
  overflow:hidden;
  background:var(--glass);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);
  box-shadow:0 8px 22px rgba(0,0,0,.4);
  transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  opacity:0;
  transform:translateY(10px);
  animation:rise .4s ease forwards;
}
@keyframes rise{to{opacity:1;transform:translateY(0);}}
.card:hover, .card:focus-within{
  transform:translateY(-5px) scale(1.025);
  border-color:var(--line-strong);
  box-shadow:0 0 0 1px var(--line-strong), 0 16px 34px rgba(0,0,0,.55), 0 0 26px rgba(40,209,124,.28);
}
.card:focus-within{outline:2px solid var(--accent-bright);outline-offset:2px;}
.thumbwrap{position:relative;width:100%;padding-top:100%;overflow:hidden;}
.thumb{
  position:absolute;inset:0;
  background-size:cover;background-position:center;background-repeat:no-repeat;
  transition:transform .35s ease;
}
.card:hover .thumb{transform:scale(1.08);}
.thumbwrap::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, transparent 45%, rgba(2,12,7,.85) 100%);
}
.tag{
  position:absolute;top:8px;left:8px;z-index:2;
  font-size:9.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  padding:4px 8px;border-radius:6px;
  background:rgba(3,16,10,.72);
  border:1px solid var(--line);
  color:var(--accent-bright);
}
.fav{
  position:absolute;top:6px;right:6px;z-index:3;
  width:28px;height:28px;border-radius:8px;
  border:1px solid transparent;
  background:rgba(3,16,10,.55);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  color:var(--text-dim);
  transition:color .15s, transform .1s, background .15s;
}
.fav:hover{background:rgba(3,16,10,.8);transform:scale(1.08);}
.fav.on{color:var(--star);}
.fav svg{width:15px;height:15px;}
.card-title{
  position:absolute;bottom:0;left:0;right:0;z-index:2;
  padding:9px 10px;
  font-size:12.5px;font-weight:600;
  color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:6px;
}
.card-title .play{
  opacity:0;transform:translateX(-4px);
  transition:opacity .15s, transform .15s;
  color:var(--accent-bright);
  font-size:11px;flex:0 0 auto;
}
.card:hover .card-title .play{opacity:1;transform:translateX(0);}
.card.hide{display:none;}


.empty{
  display:none;
  text-align:center;
  padding:70px 20px;
  color:var(--text-dim);
}
.empty.show{display:block;}
.empty .glyph{font-family:var(--font-display);font-size:22px;color:var(--accent);margin-bottom:14px;}
.empty p{font-size:13.5px;margin-bottom:16px;}
.empty button{
  padding:10px 18px;border-radius:10px;border:1px solid var(--line-strong);
  background:var(--accent-deep);color:#04140b;font-weight:700;font-size:12.5px;cursor:pointer;
}

footer{
  margin-top:34px;text-align:center;color:var(--text-dim);font-size:11.5px;
  position:relative;z-index:3;
}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important;}
}
</style>
</head>

const grid = document.getElementById("grid");
const chipsEl = document.getElementById("chips");
const counterBox = document.getElementById("counterBox");
const footCount = document.getElementById("footCount");
const emptyEl = document.getElementById("empty");
const searchInput = document.getElementById("search");
const recentSection = document.getElementById("recentSection");
const recentRow = document.getElementById("recentRow");

let activeCategory = "All";
let favorites = new Set(JSON.parse(localStorage.getItem("pgz-favs") || "[]"));
let recent = JSON.parse(localStorage.getItem("pgz-recent") || "[]");

function starIcon(filled){
  return `<svg viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><polygon points="12 2 15 9 22 9.5 17 14.5 18.5 22 12 18 5.5 22 7 14.5 2 9.5 9 9 12 2"/></svg>`;
}

function buildChips(){
  const cats = ["All", ...Array.from(new Set(GAMES.map(g => g.category)))];
  chipsEl.innerHTML = cats.map(c =>
    `<button class="chip${c === activeCategory ? ' active' : ''}" data-cat="${c}">${c}</button>`
  ).join("");
  chipsEl.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.cat;
      buildChips();
      render();
    });
  });
}

function cardHTML(game, i){
  const isFav = favorites.has(game.title);
  return `
    <div class="card" style="animation-delay:${i * 25}ms" data-title="${game.title.toLowerCase()}" data-cat="${game.category}">
      <button class="fav${isFav ? ' on' : ''}" aria-label="Toggle favorite" data-fav="${game.title}">${starIcon(isFav)}</button>
      <div class="thumbwrap" data-open="${game.title}">
        <div class="thumb" style="background-image:url('${game.img}')"></div>
        <span class="tag">${game.category}</span>
      </div>
      <div class="card-title" data-open="${game.title}">${game.title}<span class="play">▶</span></div>
    </div>`;
}

function render(){
  const q = searchInput.value.toLowerCase().trim();
  const filtered = GAMES.filter(g =>
    (activeCategory === "All" || g.category === activeCategory) &&
    g.title.toLowerCase().includes(q)
  );

  grid.innerHTML = filtered.map((g, i) => cardHTML(g, i)).join("");
  counterBox.textContent = filtered.length + (filtered.length === 1 ? " game" : " games");
  footCount.textContent = GAMES.length;
  emptyEl.classList.toggle("show", filtered.length === 0);

  grid.querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", () => {
      const game = GAMES.find(g => g.title === el.dataset.open);
      if (game) openGame(game);
    });
  });
  grid.querySelectorAll("[data-fav]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const title = btn.dataset.fav;
      favorites.has(title) ? favorites.delete(title) : favorites.add(title);
      localStorage.setItem("pgz-favs", JSON.stringify([...favorites]));
      render();
    });
  });

  renderRecent();
}

function renderRecent(){
  if (!recent.length){ recentSection.style.display = "none"; return; }
  recentSection.style.display = "block";
  recentRow.innerHTML = recent.map(title => {
    const g = GAMES.find(x => x.title === title);
    if (!g) return "";
    return `<div class="rchip" data-open="${g.title}"><img src="${g.img}" alt="">${g.title}</div>`;
  }).join("");
  recentRow.querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", () => {
      const game = GAMES.find(g => g.title === el.dataset.open);
      if (game) openGame(game);
    });
  });
}

function pushRecent(title){
  recent = [title, ...recent.filter(t => t !== title)].slice(0, 6);
  localStorage.setItem("pgz-recent", JSON.stringify(recent));
}

async function openGame(game){
  pushRecent(game.title);
  render();

  const win = window.open("about:blank", "_blank");
  if (!win) return;

  win.document.open();
  win.document.write(`
    <title>${game.title}</title>
    <style>
      html,body{height:100%;margin:0;background:#030b07;display:flex;align-items:center;justify-content:center;font-family:"Space Grotesk",sans-serif;color:#d8fbe9;}
      .spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(40,209,124,.25);border-top-color:#28d17c;animation:sp .8s linear infinite;margin-bottom:14px;}
      @keyframes sp{to{transform:rotate(360deg);}}
      .box{display:flex;flex-direction:column;align-items:center;font-size:13px;letter-spacing:.5px;}
    </style>
    <div class="box"><div class="spin"></div>Loading ${game.title}...</div>
  `);
  win.document.close();

  const faviconLink = win.document.createElement("link");
  faviconLink.rel = "icon";
  faviconLink.href = "https://i.postimg.cc/BbpTp2pc/PFP.png";
  win.document.head.appendChild(faviconLink);

  try {
    const res = await fetch(game.url);
    const html = await res.text();
    win.document.open();
    win.document.write(html);
    win.document.close();
    win.document.title = game.title;
  } catch (e) {
    win.document.open();
    win.document.write(`<body style="background:#030b07;color:#d8fbe9;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;">Failed to load ${game.title}</body>`);
    win.document.close();
  }
}

document.getElementById("resetBtn").addEventListener("click", () => {
  searchInput.value = "";
  activeCategory = "All";
  buildChips();
  render();
});

searchInput.addEventListener("input", render);

buildChips();
render();
</script>
